services:
  - type: web
    name: streamholland-analytics-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: cd analytics-backend && npm install
    startCommand: cd analytics-backend && npm start
    envVars:
      - key: PORT
        value: 10000
      - key: ALLOWED_ORIGINS
        value: https://iptv-website-phi.vercel.app,https://streamholland.nl,http://localhost:5173
      - key: NODE_ENV
        value: production
    healthCheckPath: /health
    autoDeploy: true
