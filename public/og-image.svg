<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- SEO Metadata -->
  <title>Stream Holland - Premium IPTV Nederland | 30.500+ Kanalen | 4K Streaming</title>
  <desc>Stream Holland biedt premium IPTV abonnementen in Nederland met 30.500+ live kanalen, 150.000+ films en series in 4K UHD kwaliteit. Betrouwbare IPTV service met 99.9% uptime, Nederlandse support 24/7, en compatibel met alle apparaten.</desc>
  <metadata>
    <rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
             xmlns:dc="http://purl.org/dc/elements/1.1/">
      <rdf:Description>
        <dc:title>Stream Holland - Premium IPTV Nederland</dc:title>
        <dc:description>Premium IPTV streaming service in Nederland met 30.500+ kanalen en 150.000+ films</dc:description>
        <dc:subject>IPTV Nederland, IPTV abonnement, IPTV kopen, Nederlandse IPTV, IPTV Holland, premium IPTV, IPTV streaming, 4K IPTV, IPTV zonder contract, beste IPTV Nederland, goedkope IPTV, IPTV diensten, live TV streaming, online televisie, internet TV, IPTV box, IPTV app, IPTV Samsung TV, IPTV LG TV, IPTV Fire Stick, IPTV aanbieder, betrouwbare IPTV, Nederlandse kanalen, internationale kanalen, sport kanalen IPTV, film streaming, series streaming, VOD IPTV, catch-up TV, EPG IPTV, HD IPTV, UHD IPTV, IPTV kwaliteit, IPTV service, IPTV support, IPTV Nederland goedkoop, IPTV abonnement Nederland, IPTV kopen Nederland, IPTV aanbieder Nederland, legale IPTV</dc:subject>
        <dc:publisher>Stream Holland</dc:publisher>
        <dc:language>nl-NL</dc:language>
        <dc:format>image/svg+xml</dc:format>
      </rdf:Description>
    </rdf:RDF>
  </metadata>

  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#121110;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a1918;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#121110;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6B2C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E85D00;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="#FF6B2C" opacity="0.1"/>
  <circle cx="1100" cy="530" r="200" fill="#FF6B2C" opacity="0.1"/>

  <!-- Logo (Play button) -->
  <g transform="translate(100, 180)">
    <circle cx="40" cy="40" r="40" fill="#000000"/>
    <path d="M 30 20 L 30 60 L 60 40 Z" fill="#FF6B2C"/>
  </g>

  <!-- Brand Name -->
  <text x="200" y="235" font-family="Arial, sans-serif" font-size="52" font-weight="700" fill="white">
    streamholland
  </text>

  <!-- Tagline -->
  <text x="100" y="320" font-family="Arial, sans-serif" font-size="36" font-weight="600" fill="url(#orangeGradient)">
    Premium IPTV Streaming Service
  </text>

  <!-- Features -->
  <g transform="translate(100, 380)">
    <!-- Feature 1 -->
    <circle cx="10" cy="10" r="8" fill="#FF6B2C"/>
    <text x="30" y="18" font-family="Arial, sans-serif" font-size="28" fill="#E0E0E0">
      30.500+ Live Kanalen
    </text>

    <!-- Feature 2 -->
    <circle cx="10" cy="60" r="8" fill="#FF6B2C"/>
    <text x="30" y="68" font-family="Arial, sans-serif" font-size="28" fill="#E0E0E0">
      150.000+ Films &amp; Series
    </text>

    <!-- Feature 3 -->
    <circle cx="10" cy="110" r="8" fill="#FF6B2C"/>
    <text x="30" y="118" font-family="Arial, sans-serif" font-size="28" fill="#E0E0E0">
      4K UHD Kwaliteit | 99.9% Uptime
    </text>
  </g>

  <!-- CTA Badge -->
  <rect x="850" y="450" width="280" height="100" rx="20" fill="url(#orangeGradient)"/>
  <text x="990" y="490" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="white" text-anchor="middle">
    Vanaf €23
  </text>
  <text x="990" y="525" font-family="Arial, sans-serif" font-size="18" fill="white" text-anchor="middle">
    3 maanden
  </text>
</svg>
