# Fly.io configuration for Stream Holland Analytics API
app = "streamholland-analytics"
primary_region = "ams" # Amsterdam (closest to Netherlands)

[build]
  [build.args]
    NODE_VERSION = "18"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  ALLOWED_ORIGINS = "https://iptv-website-phi.vercel.app,https://streamholland.nl,http://localhost:5173"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1

[mounts]
  source = "analytics_data"
  destination = "/data"
