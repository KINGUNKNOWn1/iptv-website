<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analytics Dashboard - IPTV Holland</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 1400px;
      margin: 0 auto;
    }

    header {
      background: white;
      padding: 30px;
      border-radius: 16px;
      margin-bottom: 30px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    }

    h1 {
      font-size: 32px;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .filters {
      display: flex;
      gap: 15px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 10px 24px;
      border: 2px solid #e0e7ff;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border-color: #667eea;
    }

    .filter-btn:hover {
      border-color: #667eea;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .stat-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.15);
    }

    .stat-label {
      font-size: 14px;
      color: #6b7280;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .stat-value {
      font-size: 42px;
      font-weight: 800;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .stat-change {
      font-size: 14px;
      margin-top: 8px;
      color: #10b981;
      font-weight: 600;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .chart-card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    }

    .chart-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      color: #1f2937;
    }

    .chart-container {
      position: relative;
      height: 300px;
    }

    .table-card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
      margin-bottom: 30px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      text-align: left;
      padding: 15px;
      background: #f9fafb;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #6b7280;
    }

    td {
      padding: 15px;
      border-bottom: 1px solid #f3f4f6;
    }

    tr:hover {
      background: #f9fafb;
    }

    .realtime-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #10b981;
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: #6b7280;
    }

    @media (max-width: 768px) {
      .charts-grid {
        grid-template-columns: 1fr;
      }

      .stat-value {
        font-size: 32px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 Analytics Dashboard</h1>
      <p style="color: #6b7280; margin-top: 8px;">Real-time visitor analytics voor IPTV Holland</p>

      <div class="filters">
        <button class="filter-btn active" onclick="setRange(7)">7 Days</button>
        <button class="filter-btn" onclick="setRange(14)">14 Days</button>
        <button class="filter-btn" onclick="setRange(30)">30 Days</button>
        <button class="filter-btn" onclick="setRange(90)">90 Days</button>
      </div>
    </header>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Visitors</div>
        <div class="stat-value" id="totalVisitors">-</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Total Page Views</div>
        <div class="stat-value" id="totalPageViews">-</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">Today's Visitors</div>
        <div class="stat-value" id="todayVisitors">-</div>
      </div>

      <div class="stat-card">
        <div class="stat-label">
          <span class="realtime-badge">
            <span class="pulse"></span>
            LIVE
          </span>
          Active Now
        </div>
        <div class="stat-value" id="activeNow">-</div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">Daily Visitors & Page Views</div>
        <div class="chart-container">
          <canvas id="dailyChart"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-title">Traffic Sources</div>
        <div class="chart-container">
          <canvas id="deviceChart"></canvas>
        </div>
      </div>
    </div>

    <div class="charts-grid">
      <div class="chart-card">
        <div class="chart-title">Browser Distribution</div>
        <div class="chart-container">
          <canvas id="browserChart"></canvas>
        </div>
      </div>

      <div class="chart-card">
        <div class="chart-title">Operating Systems</div>
        <div class="chart-container">
          <canvas id="osChart"></canvas>
        </div>
      </div>
    </div>

    <div class="table-card">
      <div class="chart-title">Top Pages</div>
      <table id="topPagesTable">
        <thead>
          <tr>
            <th>Page URL</th>
            <th>Views</th>
          </tr>
        </thead>
        <tbody id="topPagesBody"></tbody>
      </table>
    </div>

    <div class="table-card">
      <div class="chart-title">Top Referrers</div>
      <table id="topReferrersTable">
        <thead>
          <tr>
            <th>Referrer</th>
            <th>Visits</th>
          </tr>
        </thead>
        <tbody id="topReferrersBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    let currentRange = 7;
    let charts = {};

    async function fetchStats() {
      try {
        const [statsRes, realtimeRes] = await Promise.all([
          fetch(`/api/stats?range=${currentRange}`),
          fetch('/api/realtime')
        ]);

        const stats = await statsRes.json();
        const realtime = await realtimeRes.json();

        updateUI(stats, realtime);
      } catch (error) {
        console.error('Failed to fetch stats:', error);
      }
    }

    function updateUI(stats, realtime) {
      // Update stat cards
      document.getElementById('totalVisitors').textContent = stats.total.visitors.toLocaleString();
      document.getElementById('totalPageViews').textContent = stats.total.pageViews.toLocaleString();
      document.getElementById('todayVisitors').textContent = stats.today.visitors.toLocaleString();
      document.getElementById('activeNow').textContent = realtime.activeNow;

      // Update daily chart
      updateDailyChart(stats.dailyViews);

      // Update device chart
      updateDeviceChart(stats.deviceStats);

      // Update browser chart
      updateBrowserChart(stats.browserStats);

      // Update OS chart
      updateOSChart(stats.osStats);

      // Update top pages table
      updateTopPagesTable(stats.topPages);

      // Update top referrers table
      updateTopReferrersTable(stats.topReferrers);
    }

    function updateDailyChart(data) {
      const ctx = document.getElementById('dailyChart');

      if (charts.daily) {
        charts.daily.destroy();
      }

      charts.daily = new Chart(ctx, {
        type: 'line',
        data: {
          labels: data.map(d => new Date(d.date).toLocaleDateString('nl-NL', { month: 'short', day: 'numeric' })),
          datasets: [
            {
              label: 'Page Views',
              data: data.map(d => d.views),
              borderColor: '#667eea',
              backgroundColor: 'rgba(102, 126, 234, 0.1)',
              tension: 0.4,
              fill: true
            },
            {
              label: 'Unique Visitors',
              data: data.map(d => d.visitors),
              borderColor: '#764ba2',
              backgroundColor: 'rgba(118, 75, 162, 0.1)',
              tension: 0.4,
              fill: true
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              position: 'bottom'
            }
          },
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    }

    function updateDeviceChart(data) {
      const ctx = document.getElementById('deviceChart');

      if (charts.device) {
        charts.device.destroy();
      }

      charts.device = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels: data.map(d => d.device_type),
          datasets: [{
            data: data.map(d => d.count),
            backgroundColor: ['#667eea', '#764ba2', '#f59e0b']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom'
            }
          }
        }
      });
    }

    function updateBrowserChart(data) {
      const ctx = document.getElementById('browserChart');

      if (charts.browser) {
        charts.browser.destroy();
      }

      charts.browser = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: data.map(d => d.browser),
          datasets: [{
            label: 'Visitors',
            data: data.map(d => d.count),
            backgroundColor: '#667eea'
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: false
            }
          },
          scales: {
            y: {
              beginAtZero: true
            }
          }
        }
      });
    }

    function updateOSChart(data) {
      const ctx = document.getElementById('osChart');

      if (charts.os) {
        charts.os.destroy();
      }

      charts.os = new Chart(ctx, {
        type: 'pie',
        data: {
          labels: data.map(d => d.os),
          datasets: [{
            data: data.map(d => d.count),
            backgroundColor: ['#667eea', '#764ba2', '#f59e0b', '#10b981', '#ef4444']
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              position: 'bottom'
            }
          }
        }
      });
    }

    function updateTopPagesTable(data) {
      const tbody = document.getElementById('topPagesBody');
      tbody.innerHTML = data.map(page => `
        <tr>
          <td>${page.page_url}</td>
          <td><strong>${page.views}</strong></td>
        </tr>
      `).join('');
    }

    function updateTopReferrersTable(data) {
      const tbody = document.getElementById('topReferrersBody');
      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="2" style="text-align: center; color: #6b7280;">No referrer data yet</td></tr>';
      } else {
        tbody.innerHTML = data.map(ref => `
          <tr>
            <td>${ref.referrer}</td>
            <td><strong>${ref.count}</strong></td>
          </tr>
        `).join('');
      }
    }

    function setRange(days) {
      currentRange = days;

      // Update active button
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.classList.remove('active');
      });
      event.target.classList.add('active');

      fetchStats();
    }

    // Initial load and auto-refresh every 30 seconds
    fetchStats();
    setInterval(fetchStats, 30000);
  </script>
</body>
</html>
